<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - 7Я</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-96">
        <h2 class="text-2xl font-bold text-center mb-6">Вход в аккаунт</h2>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-4 text-sm">
            {{ messages[0] }}
        </div>
        {% endif %}
        {% endwith %}
        <form method="post">
            <input type="text" name="username" placeholder="Имя пользователя" required
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4">
            <input type="password" name="password" placeholder="Пароль" required
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
                Войти
            </button>
        </form>
        <div class="mt-4 text-center">
            <p class="text-gray-500 text-sm">
                Нет аккаунта? <a href="/register" class="text-blue-600">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</body>
</html>
